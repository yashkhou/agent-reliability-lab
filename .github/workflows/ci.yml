name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [agent-policy-compiler, agent-replay, agent-scheduler-sim, context-budgeter, context-firewall, eval-capsule, failure-corpus, handoff-spec, mcp-chaos, schema-evolution-guard, tool-contract-fuzzer, toolgraph-profiler]
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
